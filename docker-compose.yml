# Plannerr — full stack in one command: web (nginx) → server (FastAPI) → db (Postgres 18).

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plannerr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-plannerr}
    volumes:
      # Postgres 18 keeps PGDATA under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plannerr} -d ${POSTGRES_DB:-plannerr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    env_file: .env
    environment:
      # Point at the db service regardless of what .env says for local dev.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-plannerr}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-plannerr}
      COOKIE_SECURE: "true"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000" # internal only; the web container proxies /api

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server

volumes:
  pgdata:
