[project]
name = "server"
version = "0.1.0"
description = "Plannerr API — FastAPI backend for the Plannerr assignment tracker"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "apscheduler>=3.10,<4",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pywebpush>=2.0.0",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
